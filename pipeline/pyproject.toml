[project]
name = "feria"
version = "0.1.0"
description = "Pipeline de la Agenda Feria del Libro Córdoba 2026"
license = "GPL-3.0-or-later"
authors = [{ name = "Illak Zapata" }]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
